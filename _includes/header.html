<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">RV</span>Ricardo Viana</a>
    <div class="header-controls js-controls">
      <div class="language-controls" role="group" aria-label="Language / Idioma">
        <button type="button" data-set-lang="en" aria-label="English" aria-pressed="false" lang="en">EN</button>
        <button type="button" data-set-lang="pt" aria-label="Português" aria-pressed="false" lang="pt">PT</button>
      </div>
      <button id="theme-toggle" type="button" class="icon-button" aria-label="Light theme / Tema claro" aria-pressed="false">{% include icon.html name="sun" %}</button>
      <button id="menu-toggle" type="button" class="menu-toggle" aria-label="Menu" aria-controls="site-nav" aria-expanded="false">{% include icon.html name="menu" %}<span>{% include t.html k="menu" %}</span></button>
    </div>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation / Navegação principal">
      <ul>
        {% for item in site.data.nav %}{% if item.show %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{% include i18n.html en=item.label.en pt=item.label.pt %}</a></li>
        {% endif %}{% endfor %}
      </ul>
    </nav>
  </div>
</header>
