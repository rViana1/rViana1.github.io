name: Ricardo Viana
headline:
  en: Junior Software Engineer
  pt: Engenheiro de Software Júnior
bio:
  en: I hold a bachelor’s degree in Computer Engineering and completed a Data Engineering internship at Medana.ai. I enjoy developing personal projects that solve everyday problems and make daily tasks simpler. My internship sparked my interest in pursuing a career in data, particularly in its applications to healthcare.
  pt: Sou licenciado em Engenharia Informática e realizei um estágio em Engenharia de Dados na Medana.ai. Gosto de desenvolver projetos pessoais que resolvam problemas do meu dia a dia e tornem as tarefas quotidianas mais simples. A experiência de estágio despertou o meu interesse em seguir uma carreira na área dos dados, com particular interesse nas suas aplicações à saúde.
focus:
  en: Software development and data engineering
  pt: Desenvolvimento de software e engenharia de dados
